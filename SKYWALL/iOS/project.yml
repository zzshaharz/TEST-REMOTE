# project.yml — XcodeGen project definition
# Generate Xcode project: cd iOS && xcodegen generate
# Install XcodeGen: brew install xcodegen

name: SKYWALL

options:
  bundleIdPrefix: com.skywall
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug:   debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: "NO"
    SWIFT_OPTIMIZATION_LEVEL[config=Debug]:   "-Onone"
    SWIFT_OPTIMIZATION_LEVEL[config=Release]: "-O"
    DEBUG_INFORMATION_FORMAT[config=Debug]:   "dwarf"
    DEBUG_INFORMATION_FORMAT[config=Release]: "dwarf-with-dsym"
    OTHER_SWIFT_FLAGS[config=Debug]: "-D DEBUG"
    ENABLE_TESTABILITY[config=Debug]: "YES"

targets:
  SKYWALL:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: SKYWALL
        type: group
        excludes:
          - "**/*.md"
          - "**/.DS_Store"

    info:
      path: SKYWALL/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.skywall.app"
        INFOPLIST_FILE: "SKYWALL/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: "complete"
        SWIFT_UPCOMING_FEATURE_CONCISE_MAGIC_FILE: "YES"

    entitlements:
      path: SKYWALL/SKYWALL.entitlements
      properties:
        com.apple.security.application-groups: []
        com.apple.developer.networking.multicast: true
        com.apple.developer.networking.wifi-info: true

    dependencies: []

    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --quiet
          fi
        showEnvVars: false
        runOnlyWhenInstalling: false

schemes:
  SKYWALL:
    build:
      targets:
        SKYWALL: all
    run:
      config: Debug
      commandLineArguments:
        "-com.apple.CoreData.SQLDebug": "0"
    test:
      config: Debug
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
